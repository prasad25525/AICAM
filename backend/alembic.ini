# Database migrations. The app applies them automatically on startup (app/db.py: init_db).
# Manual use, from the backend folder:
#   .\.venv\Scripts\alembic.exe upgrade head
#   .\.venv\Scripts\alembic.exe revision -m "describe change"   (then edit the new file)
[alembic]
script_location = %(here)s/migrations
# The database URL comes from the app settings (AICAM_DATABASE_URL), see migrations/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
